# Copyright Limon DAS 
name: Build Verilator for Windows (x64 + ARM64)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_verilator_windows:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [windows_amd64, windows_arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        id: build
        run: bash build.sh
        env:
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Check if release asset already exists
        id: check
        run: |
          TAG="v${{ steps.build.outputs.VERSION }}"
          ASSET="$(basename "${{ steps.build.outputs.TARBALL }}")"

          if gh release view "$TAG" --repo ${{ github.repository }} --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qxF "$ASSET"; then
            EXISTS="yes"
          else
            EXISTS="no"
          fi

          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Creates the release if missing, otherwise adds this arch's asset to it
      - name: Create release and upload
        if: steps.check.outputs.exists == 'no'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: Verilator ${{ steps.build.outputs.VERSION }} Windows
          files: ${{ steps.build.outputs.TARBALL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Already up to date
        if: steps.check.outputs.exists == 'yes'
        run: echo "Asset for ${{ matrix.arch }} in ${{ steps.check.outputs.tag }} already exists, skipping."
